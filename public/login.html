<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Equip | Login</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <a class="brand" href="/"><span class="brand-mark">SE</span><span>SHARE<br>EQUIP</span></a>
    <a class="back-link" href="/">← Home</a>
  </header>
  <main class="auth-shell">
    <section class="auth-card">
      <div class="tabs"><button class="tab active" data-auth-tab="login">Login</button><button class="tab" data-auth-tab="register">Create Account</button></div>
      <div id="authMessage" class="alert hidden"></div>

      <form id="loginForm" class="auth-form">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Sign in to Share Equip</h1>
        <label>Email<input type="email" name="email" autocomplete="email" required placeholder="you@example.com"></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required placeholder="••••••••"></label>
        <button class="btn btn-accent btn-full" type="submit">Login</button>
        <p class="demo-note">Demo admin: <strong>admin@communityequip.local</strong> / <strong>Admin123!</strong></p>
      </form>

      <form id="registerForm" class="auth-form hidden">
        <p class="eyebrow">JOIN THE COMMUNITY</p>
        <h1>Create your account</h1>
        <label>Full name<input type="text" name="name" required minlength="2" placeholder="Your name"></label>
        <label>Email<input type="email" name="email" required placeholder="you@example.com"></label>
        <label>Password<input type="password" name="password" required minlength="6" placeholder="At least 6 characters"></label>
        <button class="btn btn-accent btn-full" type="submit">Create Account</button>
      </form>
    </section>
  </main>
  <script src="/js/app.js"></script>
</body>
</html>
